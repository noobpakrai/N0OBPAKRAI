<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N0OBPAKRAI - Animações Flash de CS</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        
        /* Estilo da Logo */
        .logo-img {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
        }

        /* Título Principal */
        h1 {
            color: #ff0000; /* Vermelho estilo CS */
            font-size: 3rem;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        /* Frase de efeito */
        .subtitulo {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* Container do Player Flash e do Vídeo */
        .media-container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            margin: 20px auto;
            border: 3px solid #ff0000;
            background-color: #000;
        }

        #ruffle-player {
            width: 100%;
            height: 100%;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Seção de aviso e links */
        .aviso-extensao {
            margin: 30px auto;
            max-width: 700px;
            font-size: 1rem;
            color: #cccccc;
            line-height: 1.6;
        }

        .aviso-extensao input {
            background: #222;
            color: #ff0000;
            border: 1px solid #444;
            padding: 5px 10px;
            width: 80%;
            text-align: center;
            font-family: monospace;
            margin-top: 5px;
        }

        /* Rodapé */
        footer {
            margin-top: 50px;
            padding: 20px;
            font-size: 0.8rem;
            color: #666666;
            border-top: 1px solid #222;
        }
    </style>
    <!-- Script do Ruffle para rodar o SWF direto na página -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <!-- 1. Foto "logo site.png" -->
    <img src="logo site.png" alt="Logo N0OBPAKRAI" class="logo-img">

    <!-- 2. Nome do site -->
    <h1>N0OBPAKRAI</h1>

    <!-- 3. Frase sobre Flash e CS -->
    <p class="subtitulo">Gosta de Animações em flash? gosta de CS? aqui vai ter a mistura dos dois!</p>

    <!-- 4. SWF (N0OBPAKRAI.swf) rodando no Ruffle -->
    <div class="media-container">
        <div id="ruffle-player"></div>
    </div>

    <!-- 5. Mensagem da extensão -->
    <div class="aviso-extensao">
        <p>Não tem a extensão do ruffle? baixe ela, pois voce vai precisar (copie e cole):</p>
        <input type="text" value="https://chromewebstore.google.com/detail/ruffle-flash-emulator/donbcfbmhbcapadipfkeojnmajbakjdc?pli=1" readonly onclick="this.select()">
        <p style="margin-top: 15px;">OU veja a animação em mp4 logo abaixo:</p>
    </div>

    <!-- 6. MP4 do Swivel (N0OBPAKRAI.mp4) -->
    <div class="media-container">
        <video controls>
            <source src="N0OBPAKRAI.mp4" type="video/mp4">
            Seu navegador não suporta a tag de vídeo.
        </video>
    </div>

    <!-- 7. Direitos Autorais / Rodapé -->
    <footer>
        <p>&copy; 2026 N0OBPAKRAI. Todos os direitos reservados. Feito por um noob, para noobs.</p>
    </footer>

    <!-- Script que inicializa o arquivo Flash -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-player");
            container.appendChild(player);
            
            // Carrega o seu arquivo SWF
            player.load("N0OBPAKRAI.swf"); 
        });
    </script>

</body>
</html>
